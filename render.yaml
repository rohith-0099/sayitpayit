# Render Blueprint: free hosted demo (no card). One web service, lite mode.
# - Database: Neon Postgres (free) — paste its *direct* connection string as DATABASE_URL.
# - Guardian (Voice ID, scam model, natural voice) needs ~2 GB, so it isn't hosted: GUARDIAN_URL stays
#   empty → lite mode (banner, Guardian's rules, Gemini/browser voice). Full stack locally:
#   docker compose --profile full up --build
services:
  - type: web
    name: sayitpayit
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    # Builds run on Render's build pipeline (2 CPU / 8 GB), so the build itself isn't memory-capped.
    # Output is a standalone server with no browser sourcemaps, to stay small at runtime.
    buildCommand: npm ci && npm run build:render
    # Runtime fits the 512 MB instance: heap capped at 450 MB (measured peak ≈ 280 MB locally).
    # Migrations, demo seed only if the DB is empty, then the standalone server.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: GUARDIAN_URL
        value: ""
      - key: AG_STUDIO
        sync: false
